<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HKUST Reel Viewing Study</title>
  <style>
    :root { color-scheme: light; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { min-width: 320px; min-height: 100vh; margin: 0; color: #172033; background: #f5f7fb; display: grid; place-items: center; }
    main { box-sizing: border-box; width: min(100% - 32px, 420px); padding: 22px; }
    h1 { margin: 0 0 8px; font-size: 18px; }
    p { margin: 0 0 18px; color: #526079; line-height: 1.45; font-size: 13px; }
    label { display: block; margin-bottom: 7px; font-size: 12px; font-weight: 700; }
    input { box-sizing: border-box; width: 100%; padding: 10px 11px; border: 1px solid #cbd3e1; border-radius: 6px; font: inherit; }
    select { box-sizing: border-box; width: 100%; padding: 10px 11px; border: 1px solid #cbd3e1; border-radius: 6px; font: inherit; background: white; }
    .other-input { margin-top: 8px; }
    button { width: 100%; margin-top: 12px; padding: 10px 12px; border: 0; border-radius: 6px; color: white; background: #145da0; font: inherit; font-weight: 700; cursor: pointer; }
    button.secondary { color: #21405d; background: #dce7f2; }
    .status { margin: 16px 0; padding: 12px; border-left: 3px solid #1a8754; background: #eaf7ef; }
    .status strong, .status span { display: block; }
    .status span { margin-top: 4px; color: #286341; font-size: 13px; }
    [hidden] { display: none; }
    #message { min-height: 18px; margin-top: 10px; color: #a22b2b; font-size: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>HKUST Reel Viewing Study</h1>
    <p>Your HKUST SID links this browser session to the study ledger. Tracking is active only after you enable it.</p>

    <form id="setup-view">
      <label for="hkust-sid">HKUST SID</label>
      <input id="hkust-sid" name="hkustSid" autocomplete="off" required pattern="[A-Za-z0-9-]+" maxlength="64">
      <label for="age-bracket">Age bracket</label>
      <select id="age-bracket" name="ageBracket" required>
        <option value="">Select one</option>
        <option>Under 18</option>
        <option>18–20</option>
        <option>21–23</option>
        <option>24–26</option>
        <option>27+</option>
        <option>Other (Please specify)</option>
      </select>
      <input class="other-input" id="age-other" type="text" maxlength="255" placeholder="Please specify age bracket" hidden>
      <label for="cultural-identity">Cultural identity</label>
      <select id="cultural-identity" name="culturalIdentity" required>
        <option value="">Select one</option>
        <option>Local HK</option>
        <option>Ethnic Minority</option>
        <option>Immigrant</option>
        <option>Expat</option>
        <option>TCK</option>
        <option>International — Asian</option>
        <option>International — European</option>
        <option>International — North American</option>
        <option>International — African</option>
        <option>International — Latin American</option>
        <option>Prefer not to say</option>
        <option>Other / Mixed Background (Please specify)</option>
      </select>
      <input class="other-input" id="cultural-other" type="text" maxlength="255" placeholder="Please specify cultural identity" hidden>
      <label for="hkust-school">HKUST school</label>
      <select id="hkust-school" name="hkustSchool" required>
        <option value="">Select one</option>
        <option>SENG</option>
        <option>SSCI</option>
        <option>SBM</option>
        <option>SHSS</option>
        <option>Exchange Student</option>
        <option>Other / Interdisciplinary Major (Please specify)</option>
      </select>
      <input class="other-input" id="school-other" type="text" maxlength="255" placeholder="Please specify affiliation" hidden>
      <label for="ideological-alignment">Political / social stance</label>
      <select id="ideological-alignment" name="ideologicalAlignment" required>
        <option value="">Select one</option>
        <option>Progressive / Liberal / Left-leaning</option>
        <option>Moderate / Centrist</option>
        <option>Conservative / Right-leaning</option>
        <option>Apolitical / Generally Uninterested</option>
        <option>Prefer not to say</option>
        <option>My stance is best described as (Please specify)</option>
      </select>
      <input class="other-input" id="ideological-other" type="text" maxlength="255" placeholder="Please specify stance" hidden>
      <button type="submit">Enable tracking</button>
    </form>

    <section id="active-view" hidden>
      <div class="status">
        <strong>Active Dashboard</strong>
        <span id="active-participant"></span>
      </div>
      <p>Viewing sequence data is sent in small batches while you browse Instagram Reels.</p>
      <button id="disable-tracking" class="secondary" type="button">Disable tracking</button>
    </section>
    <div id="message" role="status" aria-live="polite"></div>
  </main>
  <script src="popup.js"></script>
</body>
</html>
